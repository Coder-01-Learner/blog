baseURL = "https://huyangs-blog.com/"
locale = "zh-cn"
defaultContentLanguage = "zh"
title = "Hu Yang's Notes and Reflections"
theme = "PaperMod"
enableRobotsTXT = true
hasCJKLanguage = true

[pagination]
  pagerSize = 20

[permalinks]
  posts = "/posts/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  DateFormat = "2006-01-02"

  [params.homeInfoParams]
    Title = "你好，我是 XXX"
    Content = "这里记录我的技术笔记与长期思考。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Coder-01-Learner"

[[menu.main]]
  name = "文章"
  pageRef = "/posts"
  weight = 10

[[menu.main]]
  name = "标签"
  pageRef = "/tags"
  weight = 20

[[menu.main]]
  name = "关于"
  pageRef = "/about"
  weight = 30

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
